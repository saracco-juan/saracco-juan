<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <radialGradient id="sheen" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#fff" opacity="0.025"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360"/></clipPath>
  </defs>

  <style>
    .card { font-family: 'Futura', 'Century Gothic', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: 1px; opacity: 0; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .c1 { animation: show 12s infinite; }
    .c2 { animation: show 12s infinite 4s; }
    .c3 { animation: show 12s infinite 8s; }
    @keyframes show { 0% { opacity: 0 } 2%, 30% { opacity: 1 } 33%, 100% { opacity: 0 } }
    .spin { animation: spin 1.8s linear infinite; transform-origin: 930px 180px; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .arm { animation: arm 12s ease-in-out infinite; transform-origin: 1135px 40px; }
    @keyframes arm { 0%, 100% { transform: rotate(0deg) } 50% { transform: rotate(2deg) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0b0b0b"/>

    <!-- intertítulos estilo Godard -->
    <g class="card c1">
      <text x="60" y="165" font-size="96" fill="#f2f0eb">JUAN</text>
      <text x="60" y="255" font-size="96" fill="#e3242b">SARACCO.</text>
    </g>
    <g class="card c2">
      <text x="60" y="165" font-size="96" fill="#f2f0eb">SOFTWARE</text>
      <text x="60" y="255" font-size="96" fill="#1f4fd8">DEVELOPER<tspan fill="#e3242b">.</tspan></text>
    </g>
    <g class="card c3">
      <text x="60" y="140" font-size="64" fill="#e3242b">THINK.</text>
      <text x="60" y="205" font-size="64" fill="#f2f0eb">BUILD.</text>
      <text x="60" y="270" font-size="64" fill="#1f4fd8">SHIP.</text>
    </g>

    <text x="62" y="318" class="mono" font-size="15" fill="#8a8780">React · TypeScript · Node.js · IA aplicada  —  Buenos Aires, AR</text>

    <!-- vinilo -->
    <g>
      <circle cx="930" cy="180" r="150" fill="#111"/>
      <g fill="none" stroke="#1d1d1d" stroke-width="1">
        <circle cx="930" cy="180" r="142"/><circle cx="930" cy="180" r="134"/><circle cx="930" cy="180" r="126"/>
        <circle cx="930" cy="180" r="118"/><circle cx="930" cy="180" r="110"/><circle cx="930" cy="180" r="102"/>
        <circle cx="930" cy="180" r="94"/><circle cx="930" cy="180" r="86"/><circle cx="930" cy="180" r="78"/>
        <circle cx="930" cy="180" r="70"/>
      </g>
      <g class="spin">
        <circle cx="930" cy="180" r="56" fill="#e3242b"/>
        <path d="M 889 180 a 41 41 0 1 1 82 0 a 41 41 0 1 1 -82 0" id="arc" fill="none"/>
        <text class="mono" font-size="11" fill="#f2f0eb" letter-spacing="2"><textPath href="#arc" startOffset="0">SARACCO · LADO A</textPath></text>
        <text x="930" y="208" class="mono" font-size="9" fill="#f2f0eb" text-anchor="middle" opacity="0.8">33⅓ RPM</text>
        <rect x="895" y="178" width="20" height="4" fill="#0b0b0b" opacity="0.35"/>
        <circle cx="930" cy="180" r="4" fill="#0b0b0b"/>
      </g>
      <circle cx="930" cy="180" r="150" fill="url(#sheen)"/>
    </g>

    <!-- brazo del tocadiscos -->
    <g class="arm" stroke="#9a978f" stroke-linecap="round" fill="none">
      <circle cx="1135" cy="40" r="14" fill="#1a1a1a" stroke-width="2"/>
      <path d="M 1135 40 L 1120 200 L 1060 255" stroke-width="5"/>
      <rect x="1046" y="248" width="22" height="14" rx="2" fill="#9a978f" stroke="none" transform="rotate(42 1057 255)"/>
    </g>

    <rect width="1200" height="360" fill="url(#grain)"/>
  </g>
</svg>
