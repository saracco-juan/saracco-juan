<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.55" stop-color="#140b33"/>
      <stop offset="1" stop-color="#03111f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#b967ff"/>
      <stop offset="1" stop-color="#ff2a6d"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b967ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#b967ff" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .title { font: 800 64px 'Segoe UI', 'Inter', Arial, sans-serif; letter-spacing: 2px; }
    .glitch1 { animation: g1 3.2s infinite steps(1); }
    .glitch2 { animation: g2 3.2s infinite steps(1); }
    @keyframes g1 { 0%,86%,100% { transform: translate(0,0); opacity: 0 } 88% { transform: translate(-6px,2px); opacity: .8 } 92% { transform: translate(5px,-2px); opacity: .8 } 95% { opacity: 0 } }
    @keyframes g2 { 0%,86%,100% { transform: translate(0,0); opacity: 0 } 89% { transform: translate(6px,-1px); opacity: .8 } 93% { transform: translate(-4px,2px); opacity: .8 } 96% { opacity: 0 } }
    .cursor { animation: blink 1s infinite steps(1); }
    @keyframes blink { 50% { opacity: 0 } }
    .type { animation: type 4s steps(34) infinite alternate; }
    @keyframes type { from { clip-path: inset(0 100% 0 0) } 60%, to { clip-path: inset(0 0 0 0) } }
    .gridmove { animation: grid 2s linear infinite; }
    @keyframes grid { from { transform: translateY(0) } to { transform: translateY(24px) } }
    .star { animation: tw 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s } .s3 { animation-delay: 2s }
    @keyframes tw { 50% { opacity: .15 } }
    .sun { animation: pulse 4s ease-in-out infinite; transform-origin: 1010px 175px; }
    @keyframes pulse { 50% { transform: scale(1.04) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- estrellas -->
    <g fill="#fff">
      <circle class="star" cx="80" cy="40" r="1.4"/><circle class="star s2" cx="240" cy="90" r="1"/>
      <circle class="star s3" cx="420" cy="30" r="1.2"/><circle class="star" cx="610" cy="70" r="1"/>
      <circle class="star s2" cx="760" cy="25" r="1.5"/><circle class="star s3" cx="880" cy="60" r="1"/>
      <circle class="star" cx="1140" cy="40" r="1.2"/><circle class="star s2" cx="1080" cy="110" r="1"/>
      <circle class="star s3" cx="520" cy="120" r="1"/><circle class="star" cx="150" cy="150" r="1"/>
    </g>

    <!-- sol synthwave -->
    <g class="sun">
      <circle cx="1010" cy="175" r="90" fill="#ff2a6d" opacity="0.9" filter="url(#glow)"/>
      <g fill="#0d0221">
        <rect x="900" y="170" width="220" height="4"/><rect x="900" y="188" width="220" height="6"/>
        <rect x="900" y="207" width="220" height="8"/>
      </g>
    </g>

    <!-- piso con grilla -->
    <g transform="translate(0 230)">
      <rect width="1200" height="90" fill="#0d0221"/>
      <g stroke="url(#grid)" stroke-width="1.2">
        <g class="gridmove">
          <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="24" x2="1200" y2="24"/>
          <line x1="0" y1="48" x2="1200" y2="48"/><line x1="0" y1="72" x2="1200" y2="72"/>
          <line x1="0" y1="-24" x2="1200" y2="-24" opacity="0"/>
        </g>
        <line x1="600" y1="0" x2="600" y2="90"/>
        <line x1="520" y1="0" x2="360" y2="90"/><line x1="680" y1="0" x2="840" y2="90"/>
        <line x1="440" y1="0" x2="120" y2="90"/><line x1="760" y1="0" x2="1080" y2="90"/>
        <line x1="360" y1="0" x2="-120" y2="90"/><line x1="840" y1="0" x2="1320" y2="90"/>
        <line x1="280" y1="0" x2="-360" y2="90"/><line x1="920" y1="0" x2="1560" y2="90"/>
      </g>
      <line x1="0" y1="0" x2="1200" y2="0" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
    </g>

    <!-- terminal -->
    <text x="60" y="78" class="mono" font-size="18" fill="#7a7aa8">~/saracco-juan <tspan fill="#00f0ff">❯</tspan> whoami</text>

    <!-- nombre con glitch -->
    <g class="title">
      <text x="60" y="150" fill="#00f0ff" class="glitch1">JUAN SARACCO</text>
      <text x="60" y="150" fill="#ff2a6d" class="glitch2">JUAN SARACCO</text>
      <text x="60" y="150" fill="url(#name)" filter="url(#glow)">JUAN SARACCO</text>
    </g>

    <g class="mono" font-size="24">
      <text x="62" y="196" fill="#e6edf3" class="type">&gt; Desarrollador de software_</text>
      <rect class="cursor" x="62" y="204" width="14" height="3" fill="#00f0ff"/>
    </g>

    <rect width="1200" height="320" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#b967ff" stroke-opacity="0.5" stroke-width="2"/>
</svg>
